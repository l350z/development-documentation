<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="royal" class="light-button">
        <ion-icon slot="start" name="globe"></ion-icon>
        語言
      </ion-button>
    </ion-buttons>
    <!-- <ion-title>{{ 'LOGIN_TITLE' | translate }}</ion-title> -->
    <ion-buttons slot="end">
      <ion-button  class="light-button">
       註冊
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="splash-bg">
  </div>
  <div class="splash-info">
    <div class="splash-logo">ST</div>
    <div class="splash-intro">
     歡迎訪問在線學習平台
    </div>
  </div>


  <ion-content>
    <ion-grid>
      <p class="tips">登錄系統</p>
    </ion-grid> 

  <form (submit)="doLogin()" name="wf">
    <ion-grid>
      <div class="account-row border-bottom ion-margin-bottom">
        <div class="full-wrapper">
          <ion-input type="text" name="workflowaccount" [(ngModel)]="model.UserNameOrEmailAddress"
            (ngModelChange)="validateInput()"   placeholder="用戶名"  ></ion-input>
        </div>
      </div>
      <!-- margin-bottom -->
      <div class="password-row border-bottom">
        <div class="full-wrapper">
          <ion-input type="password" [(ngModel)]="model.Password" (ngModelChange)="validateInput()" name="wfpassword"
            placeholder="密碼"></ion-input>
        </div>
      </div>


      <div class="button-row">
        <div>
          <ion-button type="submit" [disabled]="!loginEnabled" color="primary" expand="block">登錄</ion-button>
        </div>
      </div>
    </ion-grid>
  </form>




</ion-content>
